version: "3.8"

services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    networks:
      - clax-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - clax-network

networks:
  clax-network:
    driver: bridge
